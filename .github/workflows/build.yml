name: Build Asteroids

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asan_options: detect_leaks=1
          - os: macos-latest
            asan_options: detect_leaks=0
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      ASAN_OPTIONS: ${{ matrix.asan_options }}
    steps:
      - name: Checkout code and pinned engine
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: make install dev_install
      - name: Lint
        run: make lint
      - name: Build
        run: make -j4
      - name: Unit, gameplay and incremental build checks
        run: make test
      - name: Address and undefined behaviour sanitizers
        run: make sanitize
