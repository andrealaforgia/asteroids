name: Build Asteroids

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest 
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          make dev_install
          make install

      - name: lint
        run:
          make lint

      - name: Build 
        run: |
          make all

