name: Build Asteroids

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dev Dependencies
        run: sudo apt-get update && sudo apt-get install -y cpplint clang-format

      - name: Run Linter
        run: make lint

  build:
    runs-on: ubuntu-latest
    needs: lint  # Ensures linting passes before building
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev

      - name: Build Project
        run: make

      - name: Verify Executable
        run: |
          ls -lh asteroids
          file asteroids

